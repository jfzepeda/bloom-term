[project]
name = "market-sentinel-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.115",
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "feedparser>=6.0.11",
    "lxml>=5.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dateutil>=2.9",
    "requests>=2.32",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
